<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>운동선수 관리 AI</title>
<style>
body{margin:0;background:#071018;color:white;font-family:sans-serif;padding:20px}
.card{background:#101923;border-radius:20px;padding:20px;margin-bottom:15px}
button{padding:15px;width:100%;border-radius:15px;background:#8bdc3c;border:0;font-weight:bold}
video,canvas{width:100%;border-radius:15px;background:#000}
.score{font-size:42px;color:#8bdc3c}
</style>
</head>
<body>

<h1>운동선수 관리 AI</h1>

<div class="card">
<h2>AI 분석</h2>
<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<button onclick="startAI()">카메라 분석 시작</button>
</div>

<div class="card">
<h3>ROM 분석</h3>
<p id="rom">대기중</p>
</div>

<div class="card">
<h3>JMP 분석</h3>
<p id="jmp">대기중</p>
</div>

<div class="card">
<h3>피로도</h3>
<div class="score" id="fatigue">--</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>

<script src="js/camera.js"></script>
<script src="js/skeleton.js"></script>
<script src="js/rom.js"></script>
<script src="js/jmp.js"></script>
<script src="js/fatigue.js"></script>

</body>
</html>
